<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F6F7F9" />
    <!-- Pretendard: 로컬 번들. CDN을 쓰지 않는다 (00_프론트_읽어주세요.md 6절) -->
    <!-- 동적 서브셋 92조각 중 91번만 미리 받는다. ASCII + 최빈 한글이 들어 있어
         첫 화면 FOUT이 사라진다. 나머지 조각은 unicode-range가 걸릴 때만 요청된다. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
    />
    <link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <!-- 서비스 이름 미확정 — src/config.ts의 APP_NAME이 빌드 시 치환된다 (vite.config.ts) -->
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
